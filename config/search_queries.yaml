# Search queries organized by research category
# Each category has a list of queries to run against arXiv and Semantic Scholar

categories:
  gpu_workload_classification:
    description: "Classifying and characterizing GPU workloads"
    queries:
      - "GPU workload classification"
      - "GPU kernel characterization machine learning"
      - "GPU application fingerprinting"
      - "GPU workload profiling deep learning"

  hardware_performance_counters:
    description: "Using hardware performance counters for workload analysis"
    queries:
      - "GPU hardware performance counters"
      - "CUPTI performance monitoring GPU"
      - "GPU performance counter profiling"
      - "hardware performance counter workload identification"

  gpu_side_channels:
    description: "GPU side-channel attacks and information leakage"
    queries:
      - "GPU side-channel attack"
      - "GPU covert channel"
      - "GPU memory timing side channel"
      - "GPU shared resource contention side channel"

  ml_training_fingerprinting:
    description: "Identifying ML training workloads from observable signals"
    queries:
      - "machine learning training GPU fingerprint"
      - "deep learning workload characterization GPU"
      - "neural network training power consumption GPU"
      - "ML training kernel decomposition"

  compute_governance:
    description: "AI compute governance and hardware-enabled mechanisms"
    queries:
      - "AI compute governance"
      - "AI chip export controls"
      - "hardware-enabled AI governance"
      - "compute monitoring AI safety"

  adversarial_evasion:
    description: "Adversarial techniques to disguise or evade workload detection"
    queries:
      - "adversarial evasion workload detection"
      - "GPU workload obfuscation"
      - "adversarial machine learning detection evasion"
      - "mimicry attack workload classification"
